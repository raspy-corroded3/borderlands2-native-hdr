; bl2hdr - native HDR for Borderlands 2. Put this file next to Borderlands2.exe (Binaries\Win32).
; Edit while the game is closed. Missing keys use the defaults shown here.
; Project page: https://github.com/raspy-corroded3/borderlands2-native-hdr

[hdr]
; HDR on (1) or off (0). Also set from the game's Options > Video > HDR.
Enabled=1
; Brightness of SDR white in the 3D scene, in nits. 200-300 is typical; raise it if the game looks dark.
PaperWhiteNits=203
; Brightness of the HUD, menus, loading screens and videos, in nits. Defaults to PaperWhiteNits.
;UIWhiteNits=203
; Your display's peak brightness in nits. Measure it with TestPattern=1 (see the README).
PeakNits=1000
; How far highlights extend above SDR white: 0 = SDR look, 1 = normal, up to 2.
Strength=1.0
; 1 = show the peak-brightness test pattern instead of the game (close with Alt+F4).
TestPattern=0
; 1 = paint everything brighter than SDR white magenta (to see what HDR affects).
DebugHighlights=0

[display]
; Turn exclusive fullscreen into a borderless window (needed for the HDR output).
ForceBorderless=1

[menu]
; Add "HDR: Off/On" to Options > Video.
HdrOption=1
; Hook the game's script engine (needed for the menu option). 0 = HDR still works, no menu row.
GameHooks=1

; ---- advanced: leave these alone unless you are testing or developing ----
[d3d9]
; 9on12 = run the game's Direct3D 9 on top of Direct3D 12 (required for HDR); native = plain D3D9.
Mode=9on12

[output]
; dxgi = bl2hdr presents the frames (required for HDR); d3d9 = the game presents (no HDR).
Mode=dxgi
; hdr = FP16 scRGB output; sdr = 8-bit output.
Format=hdr

[shaders]
; hdr = HDR tonemapper; original = the game's own; replica = our rewrite of the original; tint = test.
Tonemap=hdr

[proxy]
; d3d9 implementation to forward to (relative to this folder); empty = Windows' d3d9.dll.
Chain=

[debug]
LogShaders=0
StatsIntervalSec=0
TraceFrameAtSec=0
CaptureAtSec=
QuitAfterSec=0
MinimizeAtSec=0
RestoreAtSec=0
ConsoleAtSec=
